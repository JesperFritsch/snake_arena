[project]
name = "snake-arena"
version = "0.0.0"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Jesper Fritsch" }]
dependencies = []


[tool.uv]
package = false
# snake_sim regenerates its protobuf gencode at build time with whatever
# grpcio-tools its build env resolves. Pin it to the locked runtime's version
# so the gencode is never newer than the protobuf runtime in uv.lock.
build-constraint-dependencies = ["grpcio-tools==1.80.0"]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
snake-arena-runner = { workspace = true }
snake-arena-builder = { workspace = true }
snake-arena-common = { workspace = true }
snake-arena-orchestrator = { workspace = true }
snake-arena-submitter = { workspace = true }
snake-arena-api = { workspace = true }

[dependency-groups]
dev = [
    "snake-arena-runner",
    "snake-arena-builder",
    "snake-arena-common",
    "snake-arena-orchestrator",
    "snake-arena-submitter",
    "snake-arena-api"
]